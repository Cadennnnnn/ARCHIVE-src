<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE[src] | Registro de Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg archive-navbar py-3">
      <div class="container">
        <a class="navbar-brand brand-logo" href="index.html">ARCHIVE[src]</a>
        <div class="collapse navbar-collapse show">
          <ul class="navbar-nav mx-auto gap-3">
            <li><a class="nav-link" href="index.html">Home</a></li>
            <li><a class="nav-link" href="productos.html">Productos</a></li>
            <li><a class="nav-link" href="nosotros.html">Nosotros</a></li>
            <li><a class="nav-link" href="blogs.html">Blogs</a></li>
            <li><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
          <a href="carrito.html" class="btn btn-archive-outline"><span class="cart-counter-display">Cart (0)</span></a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <section class="col-md-8 col-lg-6">
        <div class="border p-4 p-md-5 bg-white">
          <h2 class="mb-4 text-center">Registro de Usuario</h2>
          <form id="form-registro" novalidate>
            <div class="mb-3">
              <label class="form-label small text-uppercase fw-bold">RUN (sin puntos ni guion)</label>
              <input type="text" class="form-control rounded-0" id="reg-run" placeholder="Ej: 19011022K" required>
              <span class="field-msg error" id="msg-run"></span>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label small text-uppercase fw-bold">Nombre</label>
                <input type="text" class="form-control rounded-0" id="reg-nombre" placeholder="Nombre" required>
                <span class="field-msg error" id="msg-nombre"></span>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-uppercase fw-bold">Apellidos</label>
                <input type="text" class="form-control rounded-0" id="reg-apellidos" placeholder="Apellidos" required>
                <span class="field-msg error" id="msg-apellidos"></span>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small text-uppercase fw-bold">Correo Electrónico</label>
              <input type="email" class="form-control rounded-0" id="reg-correo" placeholder="@duoc.cl / @gmail.com" required>
              <span class="field-msg error" id="msg-correo"></span>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label small text-uppercase fw-bold">Contraseña (4-10 caracteres)</label>
                <input type="password" class="form-control rounded-0" id="reg-pass" required>
                <span class="field-msg error" id="msg-pass"></span>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-uppercase fw-bold">Confirmar Contraseña</label>
                <input type="password" class="form-control rounded-0" id="reg-pass2" required>
                <span class="field-msg error" id="msg-pass2"></span>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label small text-uppercase fw-bold">Región</label>
                <select class="form-select rounded-0" id="reg-region" required>
                  <option value="">-- Seleccione la región --</option>
                </select>
                <span class="field-msg error" id="msg-region"></span>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-uppercase fw-bold">Comuna</label>
                <select class="form-select rounded-0" id="reg-comuna" required>
                  <option value="">-- Seleccione la comuna --</option>
                </select>
                <span class="field-msg error" id="msg-comuna"></span>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label small text-uppercase fw-bold">Dirección</label>
              <input type="text" class="form-control rounded-0" id="reg-direccion" placeholder="Calle, Número, Depto" required>
              <span class="field-msg error" id="msg-direccion"></span>
            </div>

            <button type="submit" class="btn btn-archive-primary w-100 py-3">Registrar</button>
          </form>
        </div>
      </section>
    </div>
  </main>

  <footer class="border-top py-4 bg-light text-center small text-muted">
    &copy; 2026 ARCHIVE[src].
  </footer>

  <script src="js/data.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
