<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE[src] | Gestión de Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="border-bottom bg-white py-2">
    <div class="container-fluid d-flex justify-content-between align-items-center px-4">
      <span class="brand-logo">ARCHIVE[src] <small class="text-muted fs-6 fw-normal">| Usuarios</small></span>
      <a href="index.html" class="btn btn-sm btn-archive-outline">Volver a Dashboard</a>
    </div>
  </header>

  <div class="container-fluid">
    <div class="row">
      <nav class="col-md-3 col-lg-2 sidebar p-0">
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Gestión Productos</a></li>
          <li class="nav-item solo-admin"><a class="nav-link active" href="usuarios.html">Gestión Usuarios</a></li>
        </ul>
      </nav>

      <main class="col-md-9 col-lg-10 p-4">
        <section class="row g-4">
          <!-- FORMULARIO CREAR USUARIO ADMIN -->
          <article class="col-lg-5">
            <div class="border p-4 bg-white">
              <h4 class="mb-3">Nuevo Usuario</h4>
              <form id="form-admin-usuario">
                <div class="mb-3">
                  <label class="form-label small text-uppercase fw-bold">RUN (7-9 caracteres, sin formato)</label>
                  <input type="text" class="form-control rounded-0" id="adm-run" placeholder="19011022K" required>
                </div>
                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <label class="form-label small text-uppercase fw-bold">Nombre</label>
                    <input type="text" class="form-control rounded-0" id="adm-nom" required>
                  </div>
                  <div class="col-6">
                    <label class="form-label small text-uppercase fw-bold">Apellidos</label>
                    <input type="text" class="form-control rounded-0" id="adm-ape" required>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label small text-uppercase fw-bold">Correo Permitido</label>
                  <input type="email" class="form-control rounded-0" id="adm-mail" placeholder="@duoc.cl / @gmail.com" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small text-uppercase fw-bold">Tipo de Usuario (Rol)</label>
                  <select class="form-select rounded-0" id="adm-rol" required>
                    <option value="Administrador">Administrador</option>
                    <option value="Vendedor">Vendedor</option>
                    <option value="Cliente">Cliente</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-archive-primary w-100">Registrar Usuario</button>
              </form>
            </div>
          </article>

          <!-- LISTA DE USUARIOS -->
          <article class="col-lg-7">
            <div class="border p-4 bg-white">
              <h4 class="mb-3">Usuarios del Sistema</h4>
              <div class="table-responsive">
                <table class="table align-middle">
                  <thead class="table-light small text-uppercase">
                    <tr>
                      <th>RUN</th>
                      <th>Nombre</th>
                      <th>Correo</th>
                      <th>Rol</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>19011022K</td>
                      <td>Admin General</td>
                      <td>admin@duoc.cl</td>
                      <td><span class="badge bg-dark">Administrador</span></td>
                    </tr>
                    <tr>
                      <td>201448995</td>
                      <td>Vendedor Turno</td>
                      <td>vendedor@gmail.com</td>
                      <td><span class="badge bg-secondary">Vendedor</span></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
