<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE[src] | Detalle de Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg archive-navbar py-3">
      <div class="container">
        <a class="navbar-brand brand-logo" href="index.html">ARCHIVE[src]</a>
        <div class="collapse navbar-collapse show">
          <ul class="navbar-nav mx-auto gap-3">
            <li><a class="nav-link" href="index.html">Home</a></li>
            <li><a class="nav-link active" href="productos.html">Productos</a></li>
            <li><a class="nav-link" href="nosotros.html">Nosotros</a></li>
            <li><a class="nav-link" href="blogs.html">Blogs</a></li>
            <li><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
          <a href="carrito.html" class="btn btn-archive-outline"><span class="cart-counter-display">Cart (0)</span></a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <article class="row g-5 align-items-center" id="detalle-contenedor">
      <!-- Renderizado dinámico -->
    </article>
  </main>

  <footer class="border-top py-4 bg-light text-center small text-muted">
    &copy; 2026 ARCHIVE[src].
  </footer>

  <script src="js/data.js"></script>
  <script src="js/carrito.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const prodId = parseInt(params.get("id"), 10) || 1;
      const producto = ARCHIVE_PRODUCTS.find(p => p.id === prodId) || ARCHIVE_PRODUCTS[0];

      const cont = document.getElementById("detalle-contenedor");
      cont.innerHTML = `
        <div class="col-lg-6">
          <div class="p-4 border bg-light text-center">
            <img src="${producto.imagen}" alt="${producto.nombre}" class="img-fluid" style="max-height: 400px; object-fit: contain;">
          </div>
        </div>
        <div class="col-lg-6">
          <span class="text-muted text-uppercase fw-bold">${producto.categoria} | SKU: ${producto.codigo}</span>
          <h1 class="mt-2 mb-3">${producto.nombre}</h1>
          <h3 class="font-monospace fw-bold mb-4">$${producto.precio.toLocaleString("es-CL")}</h3>
          <p class="text-muted mb-4">${producto.descripcion}</p>
          
          <div class="mb-4">
            <label class="form-label fw-bold small text-uppercase">Seleccionar Talla:</label>
            <select class="form-select rounded-0" style="max-width: 200px;">
              ${producto.tallas.map(t => `<option value="${t}">${t}</option>`).join("")}
            </select>
          </div>

          <div class="d-flex gap-3">
            <button class="btn btn-archive-primary px-4 py-3" onclick="agregarAlCarrito(${producto.id})">Añadir al Carrito</button>
            <a href="productos.html" class="btn btn-archive-outline px-4 py-3">Volver al catálogo</a>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
