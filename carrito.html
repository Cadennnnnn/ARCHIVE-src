<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE[src] | Mi Carrito de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg archive-navbar py-3">
      <div class="container">
        <a class="navbar-brand brand-logo" href="index.html">ARCHIVE[src]</a>
        <div class="collapse navbar-collapse show">
          <ul class="navbar-nav mx-auto gap-3">
            <li><a class="nav-link" href="index.html">Home</a></li>
            <li><a class="nav-link" href="productos.html">Productos</a></li>
            <li><a class="nav-link" href="nosotros.html">Nosotros</a></li>
            <li><a class="nav-link" href="blogs.html">Blogs</a></li>
            <li><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
          <a href="carrito.html" class="btn btn-archive-outline active"><span class="cart-counter-display">Cart (0)</span></a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <h1 class="mb-4">MI CARRITO DE COMPRAS</h1>
    <div class="row g-5">
      <section class="col-lg-8">
        <div class="table-responsive border p-3">
          <table class="table align-middle">
            <thead class="table-light text-uppercase small">
              <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
                <th class="text-end">Acción</th>
              </tr>
            </thead>
            <tbody id="carrito-items-tabla">
              <!-- Renderizado desde carrito.js -->
            </tbody>
          </table>
        </div>
      </section>

      <section class="col-lg-4">
        <div class="p-4 border bg-light">
          <h4 class="mb-3">RESUMEN</h4>
          <div class="d-flex justify-content-between mb-3">
            <span class="text-uppercase fw-bold">TOTAL:</span>
            <span class="font-monospace fw-bold fs-4" id="carrito-total-monto">$0</span>
          </div>
          
          <div class="my-3">
            <label class="form-label small text-muted">Ingrese el cupón de descuento</label>
            <div class="input-group">
              <input type="text" class="form-control rounded-0" placeholder="CUPÓN">
              <button class="btn btn-outline-dark rounded-0" type="button" onclick="alert('Cupón verificado.')">APLICAR</button>
            </div>
          </div>

          <button class="btn btn-archive-primary w-100 py-3 mt-3" onclick="alert('Iniciando pasarela de pago...');">PAGAR</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="border-top py-4 bg-light text-center small text-muted">
    &copy; 2026 ARCHIVE[src].
  </footer>

  <script src="js/data.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
