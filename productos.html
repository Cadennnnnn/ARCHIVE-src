<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE[src] | Catálogo de Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg archive-navbar py-3">
      <div class="container">
        <a class="navbar-brand brand-logo" href="index.html">ARCHIVE[src]</a>
        <div class="collapse navbar-collapse show">
          <ul class="navbar-nav mx-auto gap-3">
            <li><a class="nav-link" href="index.html">Home</a></li>
            <li><a class="nav-link active" href="productos.html">Productos</a></li>
            <li><a class="nav-link" href="nosotros.html">Nosotros</a></li>
            <li><a class="nav-link" href="blogs.html">Blogs</a></li>
            <li><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
          <a href="carrito.html" class="btn btn-archive-outline"><span class="cart-counter-display">Cart (0)</span></a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <section class="border-bottom pb-3 mb-4">
      <h1>PRODUCTOS</h1>
      <p class="text-muted">Explora todo el stock disponible en calzado, ropa y accesorios.</p>
    </section>

    <section class="row g-4" id="catalogo-grid">
      <!-- Inyectado vía JS con opción de ver detalle y añadir -->
    </section>
  </main>

  <footer class="border-top py-4 bg-light text-center small text-muted">
    &copy; 2026 ARCHIVE[src].
  </footer>

  <script src="js/data.js"></script>
  <script src="js/carrito.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("catalogo-grid");
      grid.innerHTML = ARCHIVE_PRODUCTS.map(p => `
        <article class="col-12 col-sm-6 col-md-4 col-lg-3">
          <div class="product-card p-3 h-100 d-flex flex-column">
            <div class="product-img-box mb-2">
              <a href="detalle-producto.html?id=${p.id}"><img src="${p.imagen}" alt="${p.nombre}"></a>
            </div>
            <span class="text-muted small text-uppercase">${p.categoria}</span>
            <h6 class="fw-bold my-1"><a href="detalle-producto.html?id=${p.id}">${p.nombre}</a></h6>
            <span class="font-monospace fw-bold mb-3">$${p.precio.toLocaleString("es-CL")}</span>
            <div class="mt-auto d-flex gap-2">
              <a href="detalle-producto.html?id=${p.id}" class="btn btn-sm btn-archive-outline w-50">Detalle</a>
              <button class="btn btn-sm btn-archive-primary w-50" onclick="agregarAlCarrito(${p.id})">Añadir</button>
            </div>
          </div>
        </article>
      `).join("");
    });
  </script>
</body>
</html>
