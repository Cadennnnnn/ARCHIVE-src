<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE[src] | Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg archive-navbar py-3">
      <div class="container">
        <a class="navbar-brand brand-logo" href="index.html">ARCHIVE[src]</a>
        <div class="collapse navbar-collapse show">
          <ul class="navbar-nav mx-auto gap-3">
            <li><a class="nav-link" href="index.html">Home</a></li>
            <li><a class="nav-link" href="productos.html">Productos</a></li>
            <li><a class="nav-link" href="nosotros.html">Nosotros</a></li>
            <li><a class="nav-link" href="blogs.html">Blogs</a></li>
            <li><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
          <a href="carrito.html" class="btn btn-archive-outline"><span class="cart-counter-display">Cart (0)</span></a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <section class="col-md-6 col-lg-4 text-center">
        <span class="brand-logo fs-2 d-block mb-3">ARCHIVE[src]</span>
        <div class="border p-4 bg-white text-start">
          <h4 class="mb-4 text-center">Inicio de Sesión</h4>
          <form id="form-login" novalidate>
            <div class="mb-3">
              <label class="form-label small text-uppercase fw-bold">Correo</label>
              <input type="email" class="form-control rounded-0" id="login-correo" placeholder="usuario@duoc.cl" required>
              <span class="field-msg error" id="msg-login-correo"></span>
            </div>
            <div class="mb-4">
              <label class="form-label small text-uppercase fw-bold">Contraseña</label>
              <input type="password" class="form-control rounded-0" id="login-pass" required>
              <span class="field-msg error" id="msg-login-pass"></span>
            </div>
            <button type="submit" class="btn btn-archive-primary w-100 py-3">Iniciar Sesión</button>
          </form>
          <div class="mt-3 text-center small">
            <a href="registro.html" class="text-muted">¿No tienes cuenta? Regístrate aquí</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="border-top py-4 bg-light text-center small text-muted">
    &copy; 2026 ARCHIVE[src].
  </footer>

  <script src="js/data.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
